name: images
# Rootfs, cloud image and ISO from the seeds, then KVM boot tests of the
# cloud image on BIOS and UEFI. Runs on main for image-affecting changes and
# on demand.
on:
  push:
    branches: [main]
    paths: [image/**, iso/**, packages/**, seeds/**, autoinstall/**, tests/**, vendor/**, ci/**, .github/workflows/images.yml]
  workflow_dispatch:
    inputs:
      iso:
        description: also build the ISO (downloads the 2.7 GB Ubuntu base image)
        type: boolean
        default: false
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - name: Cache Ubuntu base ISO
        if: ${{ inputs.iso }}
        id: iso-cache
        uses: actions/cache@v4
        with:
          path: iso-cache/ubuntu-26.04.1-live-server-amd64.iso
          key: ubuntu-26.04.1-live-server-amd64
      - name: Download Ubuntu base ISO
        if: ${{ inputs.iso && steps.iso-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p iso-cache && cd iso-cache
          curl -fsSL -o ubuntu-26.04.1-live-server-amd64.iso https://releases.ubuntu.com/26.04.1/ubuntu-26.04.1-live-server-amd64.iso
          echo "cc8a95cde20f6ced61a322420de00f10cc3c90ced545daa46cb9c1a117f1d927  ubuntu-26.04.1-live-server-amd64.iso" | sha256sum -c
      - name: Build packages, rootfs, qcow2 (and ISO) in an Ubuntu 26.04 container
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work \
            -e BASE_ISO=/work/iso-cache/ubuntu-26.04.1-live-server-amd64.iso \
            ubuntu:26.04 ci/in-container-build.sh ${{ inputs.iso && 'all' || 'images' }}
          sudo chown -R "$(id -u):$(id -g)" build
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf cloud-image-utils openssh-client
      - name: Boot test (BIOS)
        run: WORK=$PWD/build/test-bios tests/qcow2-boot-test.sh build/image/maluos-server-26.04-amd64.qcow2
      - name: Boot test (UEFI)
        run: WORK=$PWD/build/test-uefi SSHPORT=2224 tests/qcow2-boot-test.sh build/image/maluos-server-26.04-amd64.qcow2 --uefi
      - name: Upload image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maluos-images-${{ github.run_number }}
          path: |
            build/image/maluos-server-26.04-amd64.qcow2
            build/image/maluos-server.manifest
            build/SHA256SUMS
            build/test-*/boot-serial.log
            build/test-*/verify.log
            build/image/*.log
          retention-days: 7
          compression-level: 0
