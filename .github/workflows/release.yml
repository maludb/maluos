name: release
# On a release tag (scripts/release.sh): rebuild the cloud image from the tagged
# tree in a container, boot-test it under KVM, and attach it with checksums to
# the GitHub Release. The ISO is published from the maintainer's host.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - name: Build packages, rootfs and qcow2 in an Ubuntu 26.04 container
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work ubuntu:26.04 ci/in-container-build.sh images
          sudo chown -R "$(id -u):$(id -g)" build
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf cloud-image-utils openssh-client
      - name: Boot test (BIOS)
        run: WORK=$PWD/build/test-bios tests/qcow2-boot-test.sh build/image/maluos-server-26.04-amd64.qcow2
      - name: Attach the CI-built image to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#v}
          cp build/image/maluos-server-26.04-amd64.qcow2 "maluos-$V-server-amd64-ci.qcow2"
          sha256sum "maluos-$V-server-amd64-ci.qcow2" > SHA256SUMS-ci
          gh release upload "$GITHUB_REF_NAME" "maluos-$V-server-amd64-ci.qcow2" SHA256SUMS-ci --clobber
