name: packages
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Build packages and run lintian
        run: ci/in-container-build.sh packages
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: build/*.deb
          retention-days: 14
