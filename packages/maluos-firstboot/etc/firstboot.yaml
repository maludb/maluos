# MaluOS first-boot provisioning. Read once by maluos-firstboot.service and
# by `maluctl provision`. cloud-init user-data may overwrite this file
# (write_files) before the service runs. Every step is idempotent.

# PostgreSQL database that holds the MaluDB engine.
database: maludb

# Tenant: a PostgreSQL role and schema initialised with enable_memory_schema.
tenant:
  name: maluos

# The first principal inside the tenant (docs/principal-scoping.md).
admin_principal:
  ref: human:admin
  kind: human
  display_name: Administrator
  home_scope: org

# MC2DB listener (maludb-mc2dbd): MCP over HTTP for agents.
listener:
  enabled: true
  host: 127.0.0.1
  port: 5329
  # generate = random 64-hex token on first boot (stored in
  # /var/lib/maluos/secrets/mc2dbd.token, root only; `sudo maluctl token`);
  # none = unauthenticated listener (development only); or a literal token.
  token: generate

# OS users that get a PostgreSQL superuser login (peer auth) with the tenant
# schema on their search_path. "auto" = every human account (uid 1000-59999
# with a login shell) present at provisioning time; or a list of names.
operators: auto

# Components: packages that ship /usr/lib/maluos/components/<nn>-<name>.py run
# after the core provisioning, in name order. Disable one with enabled: false.
components:
  # The secret vault (package maluos-vault): per-user credentials and the ledger.
  maluos-vault:
    enabled: true
  # The inference gateway (package maluos-gateway). Ollama itself is installed
  # on demand: set ollama.install: true (and ollama.pull) here or in
  # /etc/maluos/gateway.yaml; `sudo maluctl gateway ollama install` later.
  maluos-gateway:
    enabled: true
    # ollama: {install: true, pull: [llama3.2:3b, nomic-embed-text], keep_warm: [llama3.2:3b]}
  # The memory face (package maluos-memory, Phase 13 slice 4): the role, the guest
  # principal and /etc/maluos/memory.yaml. Nothing is shared or exposed until
  # `maluctl memory share` / `expose`; share: [org, dept:3] here does the first.
  maluos-memory:
    enabled: true
    # share: [org]
    # tcp: {enabled: true, host: overlay, port: 11437}
  maludb-api:
    enabled: true
  # The Business OS kernel (package maludb-os-core). Off by default: the server
  # image carries the package, but a kernel for a domain nobody chose is not
  # wanted on every server. The installer's First boot screen (the "Business
  # OS" group) or the install plan (firstboot.components.maludb-os-core) turns
  # it on with the domain, the scheme and the first super-admin; so does
  # editing this file before the first boot, or `sudo maluctl provision`
  # after it. Names: <domain>, os.<domain>, app.<domain>, one per application
  # later. Use http on a LAN, https behind a TLS proxy. The first super-admin's
  # password is generated unless given and kept in
  # /var/lib/maluos/secrets/business-os/admin-password.
  maludb-os-core:
    enabled: false
    domain: maluos.local
    scheme: http
    admin_email: admin@maluos.local
    admin_name: Administrator
    # admin_password: change-me
    # anthropic_api_key: ...
    # openrouter_api_key: ...
    # The applications installed beside the kernel at first boot (package maluos-apps carries
    # the host tools), in order, by the kernel's own installer from github.com/maludb/maludb-os-<key>.
    # Absent: the four defaults. install: [] installs none. A failed application is recorded in
    # `maluctl status`; `sudo maluctl provision --force` finishes it. `maluctl app names` lists
    # the DNS names the office needs (the proxy's operator pastes them).
    # apps:
    #   install: [hr, projects, helpdesk, spaces]   # add doccloud and others on request
    #   ref: {}                                     # per key, a git tag or branch; default: the default branch
    #   propose_agents: []                          # keys whose agents are proposed rather than hired
