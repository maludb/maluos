# Add inside the site's <VirtualHost> (see 000-default.conf). Requires: a2enmod proxy proxy_http.

# Behind an upstream TLS proxy: mark the request HTTPS so cookies get Secure and any
# server-generated absolute redirect uses https (avoids mixed-content). Also: link every
# directory path with a trailing slash so mod_dir never issues an http:// slash-redirect.
SetEnvIf X-Forwarded-Proto "https" HTTPS=on

# ProxyPreserveHost MUST be Off so the localhost MCP services see Host: 127.0.0.1 (their
# DNS-rebinding guard rejects a preserved external Host with 421).
ProxyPreserveHost Off
ProxyPass        /mcp/records  http://127.0.0.1:8811/mcp
ProxyPassReverse /mcp/records  http://127.0.0.1:8811/mcp
ProxyPass        /mcp/activity http://127.0.0.1:8812/mcp
ProxyPassReverse /mcp/activity http://127.0.0.1:8812/mcp
