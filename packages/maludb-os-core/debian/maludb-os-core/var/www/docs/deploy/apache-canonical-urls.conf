	# Canonical URLs (action manifest, decision 2). Three generic rules serve the
	# /{module}/new, /{module}/{id} and /{module}/{id}/edit shapes for every module from
	# the module's own form.php / view.php, and a fourth serves extensionless pages
	# (/contacts/hygiene -> hygiene.php). Every rule is guarded by a -f test, so a URL
	# with no matching file falls through to Apache exactly as before.
	RewriteEngine On

	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]

	# A directory URL without its trailing slash (/team/departments, /settings/business) is
	# served from the directory's index.php rather than 301-ed, so the manifest's canonical
	# URLs are the URLs Apache actually answers.
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
