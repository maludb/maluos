# Business OS — after the React cut-over (docs/react-cutover-runbook.md, 2026-09-19).
#
# Two vhosts. The PUBLIC one (*:80) is the front door: it hands everything to the React app on
# :3000, except the few PHP endpoints that things other than this app's own pages call from
# outside. The INTERNAL one (127.0.0.1:8080) is the PHP JSON API: only the Next.js server and the
# actions MCP server reach it, both on this machine. The browser never talks to PHP.
# Way back: the pre-cutover files are in ~/cutover-backups/ (this file and ports.conf).

<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	# The kernel's two names (A2, 2026-09-22): os.<domain> for super-admins and agents, app.<domain>
	# for everyone's sign-in and launcher. The React app tells them apart by Host. The bare name has
	# its own virtual host below (the landing page); any other name still reaching this host is sent
	# on to app.<domain> by the React middleware.
	ServerName os.subello.com
	ServerAlias app.subello.com

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	# External MCP clients. Host is NOT preserved for these (the MCP servers check it).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:8811/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:8811/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:8812/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:8812/mcp
	ProxyPass        /mcp/memory   http://127.0.0.1:8814/mcp
	ProxyPassReverse /mcp/memory   http://127.0.0.1:8814/mcp

	# The React app must see the name the visitor typed, or its redirects name 127.0.0.1.
	<LocationMatch "^/(?!mcp/)">
		ProxyPreserveHost On
	</LocationMatch>

	RewriteEngine On

	# --- the allow-list: PHP answered here, for callers that are not this app's pages ---------
	# The bearer-token public API (session and graph are session-only: not listed, so not public).
	# (The company-profile feed and the calendar feed left with their modules in the kernel cut, 2026-09-22.)
	RewriteRule ^/api/v1/(health|me|members|org-graph)/?$ /api/v1/$1.php [L,QSA]
	RewriteRule ^/api/v1/(health|me|members|org-graph)\.php$ - [L]
	# A MaluOS desktop's enrolment, heartbeat and leave with its desk token (db/187, docs/build-specs/desk-enrolment.md).
	RewriteRule ^/api/v1/desks/agents/([0-9]+)/(tasks|activity)/?$ /api/v1/desks/agents.php?id=$1&sub=$2 [L,QSA]
	RewriteRule ^/api/v1/desks/inbox/([0-9]+)/(reply|decide|read)/?$ /api/v1/desks/inbox.php?id=$1&sub=$2 [L,QSA]
	RewriteRule ^/api/v1/desks/inference/key/?$ /api/v1/desks/inference.php?sub=key [L,QSA]
	RewriteRule ^/api/v1/desks/memory/query/?$ /api/v1/desks/memory.php?sub=query [L,QSA]
	RewriteRule ^/api/v1/desks/(enroll|heartbeat|me|leave|estate|overlay|agents|inbox|key|inference|memory)/?$ /api/v1/desks/$1.php [L,QSA]
	RewriteRule ^/api/v1/desks/(enroll|heartbeat|me|leave|estate|overlay|agents|inbox|key|inference|memory)\.php$ - [L]
	RewriteRule ^/api/v1/estate/nodes/([0-9]+)/?$ /api/v1/estate/nodes.php?id=$1 [L,QSA]
	RewriteRule ^/api/v1/estate/nodes/([0-9]+)/actions/?$ /api/v1/estate/actions.php?node=$1 [L,QSA]
	RewriteRule ^/api/v1/estate/agents/([0-9]+)/tasks/?$ /api/v1/estate/agents.php?id=$1&sub=tasks [L,QSA]
	RewriteRule ^/api/v1/estate/agents/([0-9]+)/?$ /api/v1/estate/agents.php?id=$1 [L,QSA]
	RewriteRule ^/api/v1/estate/tasks/([a-z0-9_]+)/?$ /api/v1/estate/tasks.php?id=$1 [L,QSA]
	RewriteRule ^/api/v1/estate/actions/([a-z0-9_]+)/?$ /api/v1/estate/actions.php?id=$1 [L,QSA]
	RewriteRule ^/api/v1/estate/inbox/([a-z0-9_]+)/result/?$ /api/v1/estate/inbox.php?id=$1&sub=result [L,QSA]
	RewriteRule ^/api/v1/estate/overlay/key/?$ /api/v1/estate/overlay/key.php [L,QSA]
	RewriteRule ^/api/v1/estate/overlay/hub/?$ /api/v1/estate/overlay/hub.php [L,QSA]
	# db/191: shared inference — the backends, the peers, a new key, placement (Bearer = an inference key)
	RewriteRule ^/api/v1/estate/inference/(peers|key|place)/?$ /api/v1/estate/inference.php?sub=$1 [L,QSA]
	# db/192: federated memory — the holders, the peers, the office's own answer (a node's query carries an envelope)
	RewriteRule ^/api/v1/estate/memory/(peers|query)/?$ /api/v1/estate/memory.php?sub=$1 [L,QSA]
	RewriteRule ^/api/v1/estate/(join|heartbeat|me|leave|nodes|overlay|agents|keys|inbox|tasks|actions|inference|memory)/?$ /api/v1/estate/$1.php [L,QSA]
	RewriteRule ^/api/v1/estate/(join|heartbeat|me|leave|nodes|overlay|agents|keys|inbox|tasks|actions|inference|memory)\.php$ - [L]
	RewriteRule ^/api/v1/estate/overlay/key\.php$ - [L]
	# The voice provider's webhook.
	RewriteRule ^/voice/retell-inbound\.php$ - [L]
	# Twilio's webhook for a text to an agent's number (db/156): signature-checked before anything is read.
	RewriteRule ^/channels/twilio/sms$ /channels/twilio-sms.php [L]
	# MaluMail's new-mail webhook for an agent's mailbox (M2): signature-checked before anything is acted on.
	RewriteRule ^/channels/malumail/mail$ /channels/malumail-mail.php [L]
	# The MCP proxies above.
	RewriteRule ^/mcp/(records|activity|memory)(/|$) - [L]

	# --- everything else is the React app ------------------------------------------------------
	RewriteRule ^/(.*)$ http://127.0.0.1:3000/$1 [P,L]
	ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

# The bare name: the business's own public page (the owner's request, 2026-09-22). Plain files
# under /var/www/landing — no PHP, no React, nothing signed in. The directory is copied once from
# landing-starter/ (a starter on Bootstrap 5.3 and htmx, 2026-11-12) and is the business's from then on.
<VirtualHost *:80>
	ServerName subello.com
	ServerAlias www.subello.com
	DocumentRoot /var/www/landing
	<Directory /var/www/landing>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>
	ErrorLog ${APACHE_LOG_DIR}/landing-error.log
	CustomLog ${APACHE_LOG_DIR}/landing-access.log combined
</VirtualHost>

# The applications' door (MaluOS Phase 14 slice 3; db/194): what an application on a server of its own calls, and
# nothing else. Rendered only when the business has application servers: the installer replaces DOOR_ADDRESS with
# this server's address on the business's network and DOOR_CLIENTS with the application servers' addresses or
# networks (space-separated), and removes the "#DOOR " prefixes. Plain HTTP, admitted by address; every call
# carries a token (the application's, or the server's node token). The internal vhost below is never widened.
#DOOR Listen DOOR_ADDRESS:8081
#DOOR <VirtualHost DOOR_ADDRESS:8081>
#DOOR 	DocumentRoot /var/www/html
#DOOR 	ErrorLog ${APACHE_LOG_DIR}/applications-door-error.log
#DOOR 	CustomLog ${APACHE_LOG_DIR}/applications-door-access.log combined
#DOOR 	<Location />
#DOOR 		Require ip DOOR_CLIENTS
#DOOR 	</Location>
#DOOR 	RewriteEngine On
#DOOR 	# the application's calls under its application token (docs/build-specs/kernel-directory-api.md and the specs beside it)
#DOOR 	RewriteRule ^/api/v1/directory/(members|departments|memberships|scopes|changes)(\.php)?/?$ /api/v1/directory/$1.php [L,QSA]
#DOOR 	RewriteRule ^/api/v1/agents/chat(\.php)?/?$ /api/v1/agents/chat.php [L,QSA]
#DOOR 	RewriteRule ^/api/v1/notify/sms(\.php)?/?$ /api/v1/notify/sms.php [L,QSA]
#DOOR 	RewriteRule ^/api/v1/apps/(read|mine)(\.php)?/?$ /api/v1/apps/$1.php [L,QSA]
#DOOR 	RewriteRule ^/api/v1/runs/facts(\.php)?/?$ /api/v1/runs/facts.php [L,QSA]
#DOOR 	RewriteRule ^/api/v1/ledger/periods(\.php)?/?$ /api/v1/ledger/periods.php [L,QSA]
#DOOR 	RewriteRule ^/api/v1/health(\.php)?/?$ /api/v1/health.php [L,QSA]
#DOOR 	# the installer's three calls under the server's node token (app/features/applications/remote_install.php)
#DOOR 	RewriteRule ^/api/v1/estate/apps/(prepare|register|job)(\.php)?/?$ /api/v1/estate/apps/$1.php [L,QSA]
#DOOR 	# the MaluDB API (an application's episodes and memory) and the model proxy (an application's own credential, K24)
#DOOR 	RewriteRule ^/maludb/(.*)$ http://127.0.0.1:8000/$1 [P,L]
#DOOR 	RewriteRule ^/model/(.*)$ http://127.0.0.1:8816/$1 [P,L]
#DOOR 	RewriteRule ^ - [F]
#DOOR </VirtualHost>

<VirtualHost 127.0.0.1:8080>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	RewriteEngine On

	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
