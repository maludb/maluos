# Business OS — after the React cut-over (docs/react-cutover-runbook.md, 2026-09-19).
#
# Two vhosts. The PUBLIC one (*:80) is the front door: it hands everything to the React app on
# :3000, except the few PHP endpoints that things other than this app's own pages call from
# outside. The INTERNAL one (127.0.0.1:8080) is the PHP JSON API: only the Next.js server and the
# actions MCP server reach it, both on this machine. The browser never talks to PHP.
# Way back: the pre-cutover files are in ~/cutover-backups/ (this file and ports.conf).

<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	# The kernel's two names (A2, 2026-09-22): os.<domain> for super-admins and agents, app.<domain>
	# for everyone's sign-in and launcher. The React app tells them apart by Host. The bare name has
	# its own virtual host below (the landing page); any other name still reaching this host is sent
	# on to app.<domain> by the React middleware.
	ServerName os.subello.com
	ServerAlias app.subello.com

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	# External MCP clients. Host is NOT preserved for these (the MCP servers check it).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:8811/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:8811/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:8812/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:8812/mcp

	# The React app must see the name the visitor typed, or its redirects name 127.0.0.1.
	<LocationMatch "^/(?!mcp/)">
		ProxyPreserveHost On
	</LocationMatch>

	RewriteEngine On

	# --- the allow-list: PHP answered here, for callers that are not this app's pages ---------
	# The bearer-token public API (session and graph are session-only: not listed, so not public).
	# (The company-profile feed and the calendar feed left with their modules in the kernel cut, 2026-09-22.)
	RewriteRule ^/api/v1/(health|me|members|org-graph)/?$ /api/v1/$1.php [L,QSA]
	RewriteRule ^/api/v1/(health|me|members|org-graph)\.php$ - [L]
	# The voice provider's webhook.
	RewriteRule ^/voice/retell-inbound\.php$ - [L]
	# Twilio's webhook for a text to an agent's number (db/156): signature-checked before anything is read.
	RewriteRule ^/channels/twilio/sms$ /channels/twilio-sms.php [L]
	# MaluMail's new-mail webhook for an agent's mailbox (M2): signature-checked before anything is acted on.
	RewriteRule ^/channels/malumail/mail$ /channels/malumail-mail.php [L]
	# The MCP proxies above.
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# --- everything else is the React app ------------------------------------------------------
	RewriteRule ^/(.*)$ http://127.0.0.1:3000/$1 [P,L]
	ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

# The bare name: a static landing page that shows the three doors (the owner's request,
# 2026-09-22). Plain files under /var/www/landing — no PHP, no React, nothing signed in.
<VirtualHost *:80>
	ServerName subello.com
	ServerAlias www.subello.com
	DocumentRoot /var/www/landing
	<Directory /var/www/landing>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>
	ErrorLog ${APACHE_LOG_DIR}/landing-error.log
	CustomLog ${APACHE_LOG_DIR}/landing-access.log combined
</VirtualHost>

<VirtualHost 127.0.0.1:8080>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	RewriteEngine On

	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
