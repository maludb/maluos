# React cut-over (2026-09-19): PHP is the localhost-only JSON API on :8080.
# The process environment wins over web/.env.local, so that file is left alone.
[Service]
Environment=API_BASE_URL=http://127.0.0.1:8080
# The kernel's two faces (A2, 2026-09-22): the same values as OS_HOST / APP_HOST in config/.env.
Environment=OS_HOST=os.subello.com
Environment=APP_HOST=app.subello.com
