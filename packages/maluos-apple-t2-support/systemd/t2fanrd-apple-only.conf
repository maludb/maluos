# MaluOS: the fan daemon is for Apple Macs and needs the SMC device (applesmc-t2); without both the
# unit stays inactive instead of restarting into "failed" (the live medium boots everywhere).
[Unit]
ConditionFirmware=smbios-field(sys_vendor = "Apple Inc.")
ConditionPathExistsGlob=/sys/devices/platform/applesmc.*
